<!DOCTYPE html>
<html lang="en-us bn">
  <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lock screen</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main-page">
      <div class='shwdisplay'></div>
      <div class="lock-container">
        <div class="keyboard-container" id='keycont'>
          <div class="dot-display"></div>
          <div class="key-cloam">
            <div class="key" data-value="1">1</div>
            <div class="key" data-value="2">2</div>
            <div class="key" data-value="3">3</div>
          </div>
          <div class="key-cloam">
            <div class="key" data-value="4">4</div>
            <div class="key" data-value="5">5</div>
            <div class="key" data-value="6">6</div>
          </div>
          <div class="key-cloam">
            <div class="key" data-value="7">7</div>
            <div class="key" data-value="8">8</div>
            <div class="key" data-value="9">9</div>
          </div>
          <div class="key-cloam">
            <div class="key action" data-value="back">×</div>
            <div class="key" data-value="0">0</div>
            <div class="key action" data-value="enter">→</div>
          </div>
          <div class="emergency-btn-cont">
            <button type="button" class="rma-col-btn">emergency</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    
  </body>
</html>
